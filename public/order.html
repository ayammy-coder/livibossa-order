<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席QR注文システム</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; }
    .seat-info { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .menu-section, .cart-section { background: white; padding: 20px; border-radius: 8px; }
    .menu-item { border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; cursor: pointer; border-radius: 5px; }
    .menu-item:hover { background: #f9f9f9; }
    .cart-item { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    button { background: #333; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 5px; }
    .total { font-size: 18px; font-weight: bold; margin-top: 15px; padding-top: 15px; border-top: 2px solid #333; }
  </style>
</head>
<body>

<div class="container">
  <div class="seat-info">
    <h1>座席 <span id="seatNum">1</span></h1>
  </div>

  <div class="content">
    <div class="menu-section">
      <h2>メニュー</h2>
      <div id="menuContainer"></div>
    </div>

    <div class="cart-section">
      <h2>注文内容</h2>
      <div id="cartContainer"></div>
      <div class="total">合計: ¥<span id="total">0</span></div>
      <button onclick="submitOrder()" style="width: 100%; margin-top: 15px;">注文確定</button>
    </div>
  </div>
</div>

<script>
const menu = [
  { id: 1, name: 'コーヒー', price: 800 },
  { id: 2, name: 'ワイン', price: 1200 },
  { id: 3, name: 'ケーキ', price: 600 },
  { id: 4, name: 'パスタ', price: 1800 },
  { id: 5, name: 'サラダ', price: 1500 },
];

let cart = [];
const params = new URLSearchParams(window.location.search);
const seat = params.get('seat') || '1';

document.getElementById('seatNum').textContent = seat;

// メニュー表示
const menuContainer = document.getElementById('menuContainer');
menu.forEach(item => {
  const div = document.createElement('div');
  div.className = 'menu-item';
  div.innerHTML = `<strong>${item.name}</strong><br>¥${item.price}`;
  div.onclick = () => addToCart(item);
  menuContainer.appendChild(div);
});

function addToCart(item) {
  cart.push(item);
  updateCart();
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  updateCart();
}

function updateCart() {
  const cartContainer = document.getElementById('cartContainer');
  cartContainer.innerHTML = '';
  let total = 0;

  cart.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `<span>${item.name} ¥${item.price}</span><button onclick="removeFromCart(${idx})" style="padding: 4px 8px;">削除</button>`;
    cartContainer.appendChild(div);
    total += item.price;
  });

  document.getElementById('total').textContent = total;
}

function submitOrder() {
  alert('注文を送信しました！');
  // 後でGoogle Sheetsに連携
}
</script>

</body>
</html>
